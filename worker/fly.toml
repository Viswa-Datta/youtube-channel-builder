# Fly.io render worker. Deploy from the REPO ROOT (build context must include config/ and fixtures/):
#   fly deploy --config worker/fly.toml --dockerfile worker/Dockerfile .
app = "ycb-worker-viswa"
primary_region = "sjc"   # near the Supabase project (us-west-2)

[processes]
  worker = "python -m ycb.main worker"

[[vm]]
  processes = ["worker"]
  size = "performance-2x"   # 2 dedicated cores: shared CPUs are throttled to a fraction of a core under steady load
  memory = "4gb"

[env]
  IDLE_EXIT_MINUTES = "10"  # turn the machine off after 10 idle minutes; the website wakes it for new work

# Exit code 0 (idle) leaves the machine stopped, so Fly bills nothing while idle; a crash restarts it.
[[restart]]
  policy = "on-failure"
  retries = 10
  processes = ["worker"]

[mounts]
  source = "ycb_work"
  destination = "/work"
  initial_size = "10gb"
